<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Sticky Memories</title>

    <!-- CSS External -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Responsive CSS Fixes -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background-color: #f0f2f5;
        }

        .overlay {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .welcome-card, .note-card {
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            position: relative;
            word-wrap: break-word;
        }

        .welcome-card h1 {
            font-size: clamp(1.5rem, 5vw, 2rem);
            margin-bottom: 10px;
        }

        .welcome-card p, .note-card p {
            font-size: clamp(0.9rem, 4vw, 1.1rem);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            max-width: 250px;
            padding: 12px 20px;
            font-size: 1rem;
            font-family: inherit;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        button:active {
            transform: scale(0.98);
        }

        /* تحسين خلفية الـ Blobs للشاشات الصغيرة */
        .blob {
            position: absolute;
            filter: blur(40px);
            opacity: 0.6;
            z-index: -1;
            max-width: 80vw;
            max-height: 80vw;
        }
    </style>
</head>

<body>

    <!-- Background Blobs -->
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
    <div class="blob blob4"></div>

    <div class="overlay">

        <!-- Welcome Card -->
        <div class="welcome-card" id="homeCard">
            <div class="pin"></div>
            <h1>HI SOBA 🤩</h1>
            <p>Check your message for today</p>
            <button id="openNote">Open Today's Note</button>
        </div>

        <!-- Note Card -->
        <div class="note-card" id="noteCard" style="display: none;">
            <div class="pin"></div>
            <h2>Today's Note 💛</h2>
          <img id="noteImage" src="" alt="Message Image">

<p id="noteText"></p>

<p id="noteMessage"></p>
            <button id="backBtn">Back</button>
        </div>

    </div>

    <!-- JavaScript Files -->
    <script src="script.js"></script>

</body>

</html>
